[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-beacon-radar"
version = "1.0.0"
description = "Covert Financial Webhook & Open Banking Steganography Sentinel"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "AAH20 Autonomous FinTech Systems"}
]
keywords = [
    "api-security",
    "webhooks",
    "steganography",
    "beacon-detection",
    "c2-radar",
    "entropy",
    "open-banking",
    "fdx",
    "stripe",
    "fintech",
    "a2zsoc"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
api-beacon = "api_beacon_radar.cli:main"
